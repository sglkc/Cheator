<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/64d58efce2.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="assets/css/loginn.css" />
    <title>Log In</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="container">
      <div class="forms-container">
        <div class="signin-signup">
          <!-- Sign In Form -->
          <form class="sign-in-form" id="student-form">
            <h2 class="title">Mahasiswa</h2>
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" name="nim" placeholder="NIM" required />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" name="password" placeholder="Password" required />
            </div>
            <div class="gridbutton" style="display: flex; gap: 10px; padding-top: 20px;">
              <button class="btn" id="sign-up-btn" type="button">Pengajar</button>
              <button class="btn" type="submit" value="login">Login</button>
            </div>
          </form>
          <!-- Sign Up Form -->
          <form class="sign-up-form" id="teacher-form">
            <h2 class="title">Pengajar</h2>
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" name="nip" placeholder="NIP" required />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" name="password" placeholder="Password" required />
            </div>
            <div class="gridbutton" style="display: flex; gap: 10px; padding-top: 20px;">
              <button class="btn" type="submit" value="login">Login</button>
              <button class="btn" id="sign-in-btn" type="button">Mahasiswa</button>
            </div>
          </form>
        </div>
      </div>
      <!-- Panel structure -->
      <div class="panels-container">
        <!-- Sign In Panel -->
        <div class="panel left-panel">
          <div class="content">
            <a href='/' class="logo">Cheator <span>.</span></a>
          </div>
          <img src="assets/images/login.svg" class="image" alt="Log Image" />
        </div>
        <!-- Sign Up Panel -->
        <div class="panel right-panel">
          <div class="content">
            <a href='/' class="logo">Cheator <span>.</span></a>
          </div>
          <img src="assets/images/pengawass.svg" class="image" alt="Register Image" />
        </div>
      </div>
    </div>
    <script src="assets/js/app.js"></script>
    <!-- SweetAlert for messages -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
          // Client-side message handling can be added here if needed
      });
  </script>
  </body>
</html>
