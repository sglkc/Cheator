<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <link rel="stylesheet" href="assets/css/offline.css">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <script src="assets/js/socket.io.min.js"></script>
    <link href="assets/css/icon.css" rel="stylesheet">
    <!-- TensorFlow.js -->
    <script src="assets/js/tf.min.js"></script>
    <!-- MediaPipe Pose and Face Detection -->
    <script src="assets/js/pose.js"></script>
    <script src="assets/js/face_mesh.js"></script>
    <script src="assets/js/offline.js" defer></script>
</head>

<body>
    <div class="container">
        <canvas id="videoCanvas"></canvas>
        <img class="imgcanvas" id="processedImage" alt="Processed video feed">
        <div>
            <a href="/" class="logo">Monitor <span>.</span></a>
        </div>
        <div class="controls">
            <button class="control-button" id="downloadButton">
                <span class="material-icons">download</span>
            </button>
            <button class="control-button" id="toggleButton" disabled>
                <span class="material-icons" id="toggleIcon">videocam_off</span>
            </button>
            <button class="control-button active" id="folderButton" onclick="openModal('Offline', '0', '', '')">
                <span class="material-icons">folder</span>
            </button>
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="loading-modal" style="display: none;">
        <div class="loading-modal-content">
            <div class="loading-spinner"></div>
            <h3>Loading Face Detection Model</h3>
            <p>Downloading and initializing MediaPipe models...</p>
            <div class="loading-progress">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- Modal Structure -->
    <div id="studentModal" class="studentmodel">
        <div class="studentmodel-content">
            <span class="studentmodel-close" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="studentmodel-title"></h2>
            <p id="modalClass" class="studentmodel-class"></p>
            <div class="studentmodel-body">
                <table class="studentmodel-table">
                    <thead>
                        <tr>

                        </tr>
                    </thead>
                    <tbody id="modalImageTableBody">
                        <!-- Dynamic rows will be appended here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
