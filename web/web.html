<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <link rel="stylesheet" href="assets/css/web.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js"></script>
    <!-- MediaPipe Pose and Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
    <style>
        /* Modal Styling */
        .studentmodel {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .studentmodel-content {
            background-color: #fefefe;
            margin: auto;
            /* Ubah margin menjadi auto untuk memusatkan modal */
            padding: 20px;
            border-radius: 8px;
            width: 60%;
            max-width: 700px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-height: 80%;
            /* Limit the modal height to allow scrolling */
            position: relative;
            /* Tambahkan posisi relatif untuk penyesuaian */
            top: 50%;
            /* Geser ke tengah vertikal */
            transform: translateY(-50%);
            /* Geser modal ke atas setengah dari tinggi modal untuk memusatkan */
        }

        .studentmodel-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .studentmodel-close:hover,
        .studentmodel-close:focus {
            color: #000;
        }

        .studentmodel-header {
            font-size: 2rem;
            /* Ukuran header 2rem */
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            /* Pusatkan teks dalam header */
        }

        .studentmodel-class {
            font-size: 18px;
            color: #555;
        }

        .studentmodel-body {
            margin-top: 20px;
            overflow-y: auto;
            /* Ensure scrolling inside the modal body */
            max-height: 60vh;
            /* Set a maximum height for scroll area */
        }

        .studentmodel-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 50px;
            margin-left: -20px;
        }

        .studentmodel-table th,
        .studentmodel-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .studentmodel-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .studentmodel-table-image {
            max-width: 320px;
            height: auto;
            border-radius: 4px;
            transition: transform 0.2s;
        }

        .studentmodel-table-image:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="videoCanvas"></canvas>
        <img class="imgcanvas" id="processedImage" alt="Processed video feed">
        <div>
            <a href="/" class="logo">Monitor <span>.</span></a>
        </div>
        <div class="controls">
            <button class="control-button" id="toggleButton">
                <span class="material-icons" id="toggleIcon">videocam_off</span>
            </button>
            <button class="control-button active" id="folderButton" onclick="openModal('Offline', '0', '', '')">
                <span class="material-icons">folder</span>
            </button>
        </div>
    </div>

    <!-- Modal Structure -->
    <div id="studentModal" class="studentmodel">
        <div class="studentmodel-content">
            <span class="studentmodel-close" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="studentmodel-title"></h2>
            <p id="modalClass" class="studentmodel-class"></p>
            <div class="studentmodel-body">
                <table class="studentmodel-table">
                    <thead>
                        <tr>

                        </tr>
                    </thead>
                    <tbody id="modalImageTableBody">
                        <!-- Dynamic rows will be appended here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script defer>
        const videoCanvas = document.getElementById('videoCanvas');
        const processedImage = document.getElementById('processedImage');
        const toggleButton = document.getElementById('toggleButton');
        const toggleIcon = document.getElementById('toggleIcon');

        const canvasContext = videoCanvas.getContext('2d');
        let stream = null;
        let cameraActive = false;
        let video = null;

        // Cheating detection variables
        let startTime = null;
        let tengokKiriDetected = false;
        const cheatingDuration = 0.75;
        let cheatingStatus = "no cheating";

        // Simple face detection using canvas and basic algorithms
        function detectFaceAndShoulder(imageData) {
            // Basic face detection placeholder
            // For now, we'll implement a simple bounding box and cheating logic
            const width = videoCanvas.width;
            const height = videoCanvas.height;
            
            // Mock detection results - replace with actual face detection
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Simulate face center and shoulder positions
            const faceCenter = { x: centerX, y: centerY - 50 };
            const leftShoulder = { x: centerX - 80, y: centerY + 50 };
            const rightShoulder = { x: centerX + 80, y: centerY + 50 };
            
            return {
                face: faceCenter,
                leftShoulder: leftShoulder,
                rightShoulder: rightShoulder
            };
        }

        // Calculate angle between two shoulder points
        function calculateAngle(shoulderLeft, shoulderRight) {
            const deltaX = shoulderRight.x - shoulderLeft.x;
            const deltaY = shoulderRight.y - shoulderLeft.y;
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            return angle;
        }

        // Process frame for cheating detection
        function processFrame() {
            if (!cameraActive || !video) return;

            canvasContext.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
            canvasContext.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

            // Get image data for processing
            const imageData = canvasContext.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
            
            // Detect face and shoulders (simplified implementation)
            const detection = detectFaceAndShoulder(imageData);
            
            let boxColor = 'blue';
            let text = "Stand By";
            let cheating = false;

            // Calculate shoulder angle
            if (detection.leftShoulder && detection.rightShoulder) {
                const angle = calculateAngle(detection.leftShoulder, detection.rightShoulder);
                
                if (Math.abs(angle) < 176) {
                    boxColor = 'red';
                    text = "Cheating - Tilted";
                    cheating = true;
                }
            }

            // Simple gaze detection simulation based on mouse position or random movement
            // This is a placeholder - in real implementation you'd use actual face landmarks
            const currentTime = Date.now();
            const gazeDirection = Math.sin(currentTime / 1000) * 100; // Simulate head movement
            
            if (Math.abs(gazeDirection) > 30) {
                if (startTime === null) {
                    startTime = currentTime;
                } else if ((currentTime - startTime) / 1000 >= cheatingDuration) {
                    boxColor = 'red';
                    text = "Cheating - Looking Away";
                    cheating = true;
                } else {
                    boxColor = 'yellow';
                    text = gazeDirection > 0 ? "Tengok Kanan" : "Tengok Kiri";
                }
            } else {
                startTime = null;
            }

            // Update cheating status
            cheatingStatus = cheating ? "cheating" : "no cheating";

            // Draw bounding box around face area
            const boxX = detection.face.x - 100;
            const boxY = detection.face.y - 150;
            const boxWidth = 200;
            const boxHeight = 250;

            canvasContext.strokeStyle = boxColor;
            canvasContext.lineWidth = 3;
            canvasContext.strokeRect(boxX, boxY, boxWidth, boxHeight);

            // Draw text
            canvasContext.fillStyle = boxColor;
            canvasContext.font = "24px Arial";
            canvasContext.fillText(text, boxX + 10, boxY + boxHeight - 10);

            // Draw shoulder indicators
            canvasContext.fillStyle = boxColor;
            canvasContext.beginPath();
            canvasContext.arc(detection.leftShoulder.x, detection.leftShoulder.y, 5, 0, 2 * Math.PI);
            canvasContext.fill();
            
            canvasContext.beginPath();
            canvasContext.arc(detection.rightShoulder.x, detection.rightShoulder.y, 5, 0, 2 * Math.PI);
            canvasContext.fill();

            console.log("Status Kecurangan:", cheatingStatus);

            // Copy canvas to processed image
            processedImage.src = videoCanvas.toDataURL();
            processedImage.style.display = 'block';

            // Continue processing
            if (cameraActive) {
                requestAnimationFrame(processFrame);
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then((mediaStream) => {
                    stream = mediaStream;
                    videoCanvas.width = 640;
                    videoCanvas.height = 480;

                    video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();

                    video.addEventListener('loadedmetadata', () => {
                        cameraActive = true;
                        toggleButton.classList.add('active');
                        toggleIcon.textContent = 'videocam';
                        
                        // Start processing frames
                        processFrame();
                    });
                })
                .catch((err) => {
                    console.error("Error accessing camera: ", err);
                });
        }

        function stopCamera() {
            if (stream) {
                let tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                stream = null;
                cameraActive = false;
                videoCanvas.style.display = 'none';
                processedImage.style.display = 'none';
                toggleButton.classList.remove('active');
                toggleIcon.textContent = 'videocam_off';
            }
        }

        toggleButton.addEventListener('click', () => {
            if (cameraActive) {
                stopCamera();
            } else {
                startCamera();
            }
        });
    </script>

    <script>
        function openModal(name, jumlah, imageUrls, timestamps) {
            document.getElementById('modalName').innerText = 'Mode: ' + name;
            document.getElementById('modalClass').innerText = 'Tangkapan Hari Ini: ' + jumlah;

            // Split images and timestamps
            var imageArray = imageUrls.split(',');
            var timestampArray = timestamps.split(',');

            var tableBody = document.getElementById('modalImageTableBody');
            tableBody.innerHTML = ''; // Clear any existing table rows

            // Create a single row for images
            var rowImages = document.createElement('tr');
            var cellImagesLabel = document.createElement('td');
            cellImagesLabel.colSpan = 2; // Merge cells for image label
            rowImages.appendChild(cellImagesLabel);

            // Create a single row for timestamps
            var rowTimestamps = document.createElement('tr');
            var cellTimestampsLabel = document.createElement('td');
            cellTimestampsLabel.colSpan = 2; // Merge cells for timestamp label
            rowTimestamps.appendChild(cellTimestampsLabel);

            // Loop over the images and timestamps to populate the rows
            imageArray.forEach(function (imageUrl, index) {
                if (imageUrl.trim() !== '') {
                    // Create image cell
                    var cellImage = document.createElement('td');
                    var img = document.createElement('img');
                    img.src = imageUrl.trim();
                    img.className = 'studentmodel-table-image'; // Ensure the class matches your CSS
                    img.alt = 'Bukti Kecurangan';
                    cellImage.appendChild(img);
                    rowImages.appendChild(cellImage);

                    // Create timestamp cell
                    var cellTimestamp = document.createElement('td');
                    cellTimestamp.innerText = timestampArray[index] ? timestampArray[index].trim() : 'N/A';
                    rowTimestamps.appendChild(cellTimestamp);
                }
            });

            // Append the rows to the table body
            tableBody.appendChild(rowImages);
            tableBody.appendChild(rowTimestamps);

            var modal = document.getElementById('studentModal');
            modal.style.display = 'block'; // Show the modal

            // Close modal when clicking outside of the modal content
            modal.addEventListener('click', function (event) {
                if (event.target === modal) { // Check if the click was outside the modal content
                    closeModal(); // Call the closeModal function
                }
            });
        }

        function closeModal() {
            document.getElementById('studentModal').style.display = 'none'; // Hide the modal
        }
    </script>
</body>

</html>
